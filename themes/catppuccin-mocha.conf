# qypr theme: Catppuccin Mocha (the compiled-in default, as a theme file)
# Import this in bar.conf with: import themes/catppuccin-mocha.conf
[theme]
# Colours
background    = #1e1e2e
surface       = #313244
surface-hover = #45475a
glass         = #40313244
glass-hover   = #60454a5a
glass-border  = #30cdd6f4
primary       = #89b4fa
primary-glow  = #4089b4fa
text          = #cdd6f4
text-subtle   = #a6adc8
text-muted    = #6c7086
error         = #f38ba8
success       = #a6e3a1
warning       = #fab387

style = glass