# qypr-bar example configuration
#
# Copy to $XDG_CONFIG_HOME/qypr/bar.conf (usually ~/.config/qypr/bar.conf).
# Everything here is optional: qypr-bar runs with no config at all, and every
# key falls back to the compiled-in default shown below. Read once at startup —
# restart the bar to apply changes.
#
# Syntax: [sections], `key = value`, and full-line comments (# or //).
# Comments must be on their own line: a trailing # would corrupt values such as
# the clock's strftime format.
#
# Themes can be imported from separate files (path relative to this file):
# import themes/catppuccin-mocha.conf
# (commented out: the bar now takes its palette from matugen via colors-file
# below — imported colour keys would override the generated palette)

[bar]
# Which screen edge to anchor to: top | bottom
position = top

# Height of the bar strip itself, in logical pixels.
height = 32

# Gap between the strip and the anchored screen edge. The reserved exclusive
# zone (the space tiled windows keep clear) is margin + height + 6.
margin = 6.00

# Gap at the left and right ends of the strip.
margin-side = 30.00

# Frosted-glass strip opacity, 0..1. The strip is a translucent frosted panel
# (surface tint + a light top sheen + a hairline border), matching the popovers;
# this key sets how opaque the tint is. On a blur-capable compositor, add a blur
# rule for the "qypr-bar" layer (e.g. Hyprland: `layerrule = blur, qypr-bar`)
# and a lower value (~0.4) reads as real frosted glass. Without blur, keep it
# higher (~0.8) so the glyphs stay legible over an arbitrary wallpaper.
# 0 = fully chromeless (transparent strip, may be hard to read).
backdrop = 1.00

# Modules, in visual order (left → right within each zone). Any module may go
# in any zone. Omit a key to keep the default set; give it an empty value to
# empty that zone. Unknown ids are reported on stderr and skipped.
#
# Available: active-window, battery, bluetooth, brightness, clock, dnd,
#            idle-inhibitor, keyboard-layout, launcher, media, night-light,
#            notifications, pager, power, sni, system-monitor, taskbar,
#            volume, wifi, workspaces
#
# `night-light` shifts screen colour temperature to reduce blue light (requires
# wlr-gamma-control-unstable-v1). Hides automatically on compositors without
# the protocol.
#
# `pager` merges `workspaces` + `taskbar` into one module: every workspace is
# a chip showing the app icons believed to live on it (inferred from focus
# correlation — no compositor IPC needed). Click a chip to switch workspace,
# an icon to focus its window; middle-click closes, right-click minimizes,
# scroll cycles workspaces. Hover expands the chips. Degrades to a plain
# taskbar / plain pills when the compositor lacks one of the two protocols.
#
# `taskbar` is an icons-only window list (click to focus, or minimize the
# focused window); `media`/`notifications`/`power` are the session applets.
# All four are session-sensitive — they never appear on the lock screen.
# `system-monitor` (CPU/RAM meters) is opt-in — it only appears when listed
# here, never on the lock screen or a config-less bar. `idle-inhibitor` is a
# "keep awake" toggle (click to hold the screen on); it hides when the
# compositor lacks the idle-inhibit protocol. `keyboard-layout` shows the active
# xkb layout code (e.g. US / RU) — opt-in, and it hides itself unless more than
# one layout is configured (a single layout has nothing to switch between).
# `launcher` opens the desktop application launcher (`waylaunch`, Super+D) —
# bar-only, never on the lock screen. Override with [quick-settings]
# launcher-command; the old in-bar search popover was removed as duplicate UI.
#
# The gear (Quick Settings) is always present at the right end.
modules-left = 
modules-center =pager, clock, media, notifications, bluetooth, wifi, brightness, volume, battery,power 
modules-right = 

[clock]
# strftime(3) patterns. `format` is the bar text; `tooltip-format` is the hover
# text. Examples:
#   %H:%M                 → 14:05          (24-hour)
#   %a %b %-d   %-I:%M %p → Thu Jul 17  2:05 PM
#   %I:%M %p%n%m/%d/%y    → two lines (%n = newline)
format = %-I:%M %p
tooltip-format = %A, %B %-d

# Clicking the clock opens a month calendar. `timezones` (optional, comma-
# separated IANA names) adds a live clock per zone under the calendar. Omit or
# leave empty for none.
# timezones = Asia/Tokyo, America/New_York, Europe/London

[system-monitor]
# Compact CPU/RAM meters. Re-samples /proc on the bar's 1s tick — the one
# indicator that legitimately polls (CPU/RAM have no push source). Only shown
# when `system-monitor` is in a modules- list above.
# `metrics`: which meters, in order — cpu, mem (aka ram).
metrics = cpu, mem
# `interval`: milliseconds between /proc samples (min 500).
interval = 2000

[night-light]
# Night Light: shift screen colour temperature to reduce blue light.
# Requires wlr-gamma-control-unstable-v1 (wlroots compositors: sway,
# Hyprland, etc.).  On compositors without the protocol the indicator
# hides automatically.
#
# temperature: colour temperature in Kelvin when Night Light is on.
#              Range: 2700 (warmest) — 6500 (daylight/off).  Default: 4000.
temperature = 4000

[quick-settings]
# Commands the Quick Settings buttons run. They inherit qypr-bar's environment
# (WAYLAND_DISPLAY etc. already correct — do NOT hardcode a display). Each runs
# detached in the background.
#
# screenshot-command default: interactive grimblast (drag-select a region → copy
# to clipboard + save + notify), falling back to `flameshot gui` if grimblast is
# absent. flameshot v14 is broken on Hyprland (flameshot-org/flameshot#4666).
# screenshot-command = grimblast --notify copysave area
# power-command = waylaunch --power
# launcher-command = waylaunch

[theme]
# Visual design overrides. Every key is optional — omit any to keep the
# compiled-in Catppuccin Mocha default. Restart the bar to apply.
#
# Matugen: the palette comes from the matugen-generated Material You files
# (templates registered in ~/.config/matugen/config.toml as [templates.qypr]
# and [templates.qypr-light]; each file only updates on matching -m runs).
# The bar watches both files — regenerating either re-themes the bar live.
colors-file = matugen.css
colors-file-light = matugen-light.css
#
# palette-mode: dark | light | auto. Auto follows the clock (light between
# palette-sunrise/palette-sunset, default 7..19 local) and re-themes on flips.
palette-mode = auto
# palette-sunrise = 7
# palette-sunset = 19
#
# Style: "glass" (frosted translucent + sheen + hairline) or "solid" (opaque
# card with the same hue, no translucency). Restart the bar to apply.
style = solid
#
# Icon style — how each applet draws its icon:
#   "auto"     — a symbolic icon from your active system icon theme
#                (gtk-icon-theme-name) when available, else the Nerd Font glyph.
#                Adopts your desktop icon theme on the fly. (default)
#   "symbolic" — always prefer the system icon theme (glyph fallback per-icon).
#   "glyph"    — always use the built-in Nerd Font glyphs.
icon-style = auto
#
# The menu-bar backdrop tint/border default to `background`/`text` below, so the
# strip follows your palette; override with bar-tint / bar-border-color if wanted.
#
# Fonts
# font-family = Inter
# icon-family = CaskaydiaCove Nerd Font
# font-size = 16
# font-size-large = 24
font-size-clock = 20
font-size-date = 20
#
# Colours (hex: #RRGGBB or #AARRGGBB)
# background = #1e1e2e
# surface = #313244
# surface-hover = #45475a
# glass = #40313244
# glass-hover = #60454a5a
# glass-border = #30cdd6f4
# primary = #89b4fa
# primary-glow = #4089b4fa
# text = #cdd6f4
# text-subtle = #a6adc8
# text-muted = #6c7086
# error = #f38ba8
# success = #a6e3a1
# warning = #f9e2af
#
# Spacing (int px)
# spacing-small = 8
# spacing-medium = 16
# spacing-large = 24
# spacing-xlarge = 48
#
# Radius (int px)
# radius-small = 4
# radius-medium = 8
# radius-large = 16
#
# Animation durations (ms)
# anim-fast = 150
# anim-medium = 300
# anim-slow = 500
# anim-reveal = 600
#
# Effects
# shadow-opacity = 0.6
# shadow-offset = 2
#
# Note: leave the shadow keys unset so the palette manages them — dark/light
# palettes pick the shadow automatically (light disables it to avoid ghost
# shades). Uncomment to force a specific opacity; it then wins over the
# palette in every mode.
# Statusbar
# bar-height = 36.0
# bar-icon-size = 16.0            # Nerd Font glyph size (icon-style = glyph)
# bar-symbolic-icon-size = 18.0   # themed *-symbolic icon size; raise to enlarge the
#                                 #   themed icons without growing the bar (try 20–24)
bar-icon-size = 20
bar-symbolic-icon-size = 22
bar-clock-icon-size = 14
# bar-icon-spacing = 18.0
# bar-padding = 14.0
bar-corner-radius = 14
# popover-radius = 12.0
#
# Workspace indicators
# ws-width = 28
# ws-height = 6
# ws-gap = 6
# ws-active-height = 8
# ws-radius = 999
#
# Tray (SNI)
# sni-size = 22
