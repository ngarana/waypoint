# qypr-bar example configuration
#
# Copy to $XDG_CONFIG_HOME/qypr/bar.conf (usually ~/.config/qypr/bar.conf).
# Everything here is optional: qypr-bar runs with no config at all, and every
# key falls back to the compiled-in default shown below. Read once at startup —
# restart the bar to apply changes.
#
# Syntax: [sections], `key = value`, and full-line comments (# or //).
# Comments must be on their own line: a trailing # would corrupt values such as
# the clock's strftime format.
#
# Themes can be imported from separate files (path relative to this file):
# import themes/gruvbox.conf

[bar]
# Which screen edge to anchor to: top | bottom
position = top

# Height of the bar strip itself, in logical pixels.
height = 36

# Gap between the strip and the anchored screen edge. The reserved exclusive
# zone (the space tiled windows keep clear) is margin + height + 6.
margin = 24

# Gap at the left and right ends of the strip.
margin-side = 52

# Frosted-glass strip opacity, 0..1. The strip is a translucent frosted panel
# (surface tint + a light top sheen + a hairline border), matching the popovers;
# this key sets how opaque the tint is. On a blur-capable compositor, add a blur
# rule for the "qypr-bar" layer (e.g. Hyprland: `layerrule = blur, qypr-bar`)
# and a lower value (~0.4) reads as real frosted glass. Without blur, keep it
# higher (~0.8) so the glyphs stay legible over an arbitrary wallpaper.
# 0 = fully chromeless (transparent strip, may be hard to read).
backdrop = 0.80

# Modules, in visual order (left → right within each zone). Any module may go
# in any zone. Omit a key to keep the default set; give it an empty value to
# empty that zone. Unknown ids are reported on stderr and skipped.
#
# Available: active-window, background-apps, battery, bluetooth, brightness, clock, dnd,
#            email, idle-inhibitor, keyboard-layout, launcher, mail,
#            media, night-light, notification-apps, notifications, pager, phone-link, power,
#            removable-devices, system-monitor, taskbar, volume, whatsapp, wifi,
#            workspaces
#            (old ids still accepted: usb, usb-eject → removable-devices;
#             kde-connect, phone-connect → phone-link; sni, tray → background-apps)
#
# `phone-link` is a phone paired through KDE Connect (kdeconnectd must be
# running). It shows while the phone is connected or a device asks to pair, and
# sits in the overflow while the phone is away. The flyout shows battery and
# signal, Ring, send the clipboard or files, browse the phone's storage, the
# phone's notifications (Dismiss clears one on the phone too) and pairing
# requests.
#
# `removable-devices` lists drives UDisks2 reports as removable (USB disks and
# sticks, SD cards, discs). A newly attached drive shows on the bar; a drive
# set up in /etc/fstab or /etc/crypttab counts as permanent and stays off the
# bar, listed behind the `background-apps` chevron. Click for Open / Eject. Eject unmounts every volume, locks encrypted
# ones and powers the drive off; if a volume is busy, the flyout names the
# processes using it. Polkit prompts for anything the session can't do alone
# (unmounting an fstab mount, for example).
#
# `wifi`, `bluetooth` and `volume` absorb the tray applets that duplicate them
# (nm-applet, blueman, pasystray): the applet's tray icon is hidden, right
# click on the module opens the applet's menu and middle click forwards to it.
# Keep nm-applet running: it is NetworkManager's password agent. Add claims for
# other applets in [tray] (see the end of this file).
#
# `background-apps` is one chevron for everything running or relevant that
# doesn't earn a permanent place: modules with nothing to show right now (the
# fstab drive, a phone that is away) and tray apps no module claims (Telegram,
# Steam). Tray apps get no bar space of their own unless pinned in [tray] or
# asking for attention. Old ids: sni, tray.
#
# `notification-apps` shows one icon per app with something to say: live
# notifications, or an unread count, progress or urgency the app publishes
# itself (Unity LauncherEntry: Telegram, Thunderbird, Chromium and Electron
# apps, ...). Click to focus the app's window (click again to cycle its
# windows) or launch it; right-click for the app's menu (its desktop actions,
# its own quicklist, Clear notifications); middle-click clears its
# notifications. Apps that a `whatsapp` or `email` module in the layout shows
# are left to that module. Hides when no app has anything to say.
#
# `whatsapp` and `email` (old id `mail`) are the same app buttons for one kind
# of app: a WhatsApp client (desktop app or web app), or any mail client (a
# desktop entry in the Email category, Thunderbird, Evolution, Geary, ...).
# On the bar while such an app has news, a window open, or a tray icon.
#
# `night-light` shifts screen colour temperature to reduce blue light (requires
# wlr-gamma-control-unstable-v1). Hides automatically on compositors without
# the protocol.
#
# `pager` merges `workspaces` + `taskbar` into one module: every workspace is
# a chip showing the app icons believed to live on it (inferred from focus
# correlation — no compositor IPC needed). Click a chip to switch workspace,
# an icon to focus its window; middle-click closes, right-click minimizes,
# scroll cycles workspaces. Hover expands the chips. Degrades to a plain
# taskbar / plain pills when the compositor lacks one of the two protocols.
#
# `taskbar` is an icons-only window list (click to focus, or minimize the
# focused window); `media`/`notifications`/`power` are the session applets.
# All four are session-sensitive — they never appear on the lock screen.
# `system-monitor` (CPU/RAM meters) is opt-in — it only appears when listed
# here, never on the lock screen or a config-less bar. `idle-inhibitor` is a
# "keep awake" toggle (click to hold the screen on); it hides when the
# compositor lacks the idle-inhibit protocol. `keyboard-layout` shows the active
# xkb layout code (e.g. US / RU) — opt-in, and it hides itself unless more than
# one layout is configured (a single layout has nothing to switch between).
# `launcher` opens the desktop application launcher (`waylaunch`, Super+D) —
# bar-only, never on the lock screen. Override with [quick-settings]
# launcher-command; the old in-bar search popover was removed as duplicate UI.
#
# The gear (Quick Settings) is always present at the right end.
modules-left = pager, clock
modules-center = active-window
modules-right = system-monitor, media, brightness, volume, wifi, bluetooth, dnd, night-light, idle-inhibitor, phone-link, removable-devices, notification-apps, notifications, battery, background-apps, power

[clock]
# strftime(3) patterns. `format` is the bar text; `tooltip-format` is the hover
# text. Examples:
#   %H:%M                 → 14:05          (24-hour)
#   %a %b %-d   %-I:%M %p → Thu Jul 17  2:05 PM
#   %I:%M %p%n%m/%d/%y    → two lines (%n = newline)
format = %a %b %-d   %-I:%M %p
tooltip-format = %A, %B %-d

# Clicking the clock opens a month calendar. `timezones` (optional, comma-
# separated IANA names) adds a live clock per zone under the calendar. Omit or
# leave empty for none.
# timezones = Asia/Tokyo, America/New_York, Europe/London

[system-monitor]
# Compact CPU/RAM meters. Re-samples /proc on the bar's 1s tick — the one
# indicator that legitimately polls (CPU/RAM have no push source). Only shown
# when `system-monitor` is in a modules- list above.
# `metrics`: which meters, in order — cpu, mem (aka ram).
metrics = cpu, mem
# `interval`: milliseconds between /proc samples (min 500).
interval = 2000

[night-light]
# Night Light: shift screen colour temperature to reduce blue light.
# Requires wlr-gamma-control-unstable-v1 (wlroots compositors: sway,
# Hyprland, etc.).  On compositors without the protocol the indicator
# hides automatically.
#
# temperature: colour temperature in Kelvin when Night Light is on.
#              Range: 2700 (warmest) — 6500 (daylight/off).  Default: 4000.
# temperature = 4000

[quick-settings]
# Commands the Quick Settings buttons run. They inherit qypr-bar's environment
# (WAYLAND_DISPLAY etc. already correct — do NOT hardcode a display). Each runs
# detached in the background.
#
# screenshot-command default: interactive grimblast (drag-select a region → copy
# to clipboard + save + notify), falling back to `flameshot gui` if grimblast is
# absent. flameshot v14 is broken on Hyprland (flameshot-org/flameshot#4666).
# screenshot-command = grimblast --notify copysave area
# power-command = waylaunch --power
# launcher-command = waylaunch

[lock]
# qypr-lock (the lock screen reads this file too).
#
# fingerprint: unlock by touching the reader, alongside the password. Needs only
# fprintd with an enrolled finger (fprintd-enroll); with no reader or no finger
# the lock quietly stays password-only. Default: true.
# fingerprint = true

[theme]
# Visual design overrides. Every key is optional — omit any to keep the
# compiled-in Catppuccin Mocha default. Restart the bar to apply.
#
# Matugen — take the palette from matugen-generated Material You files:
#   colors-file = ~/.cache/matugen/standard-dark.css      (dark scheme)
#   colors-file-light = ~/.cache/matugen/standard-light.css (light scheme)
# CSS custom properties (--primary: ...), @define-color lines, flat JSON, and
# matugen's nested JSON scheme format are all understood. Known M3 tokens
# (primary, on-surface, on-surface-variant, surface, surface-container*,
# outline*, error, secondary, tertiary, background, foreground) map onto the
# bar colours; missing tokens keep the defaults, and the explicit colour keys
# below still win. `matugen` / `matugen-light` are aliases for the two files.
# Both files are watched: regenerating either (wallpaper / mode change)
# re-themes the bar live.
#
# palette-mode: dark | light | auto.
#   dark  — always colors-file;           light — always colors-file-light
#           (falls back to colors-file if the light file is unset);
#   auto  — light between sunrise and sunset, dark outside; the bar
#           re-checks every minute and re-themes on flips.
# palette-location: source for solar sunrise/sunset when palette-mode = auto.
#   auto — use manual coordinates below when both are set; otherwise qypr-bar
#          uses a cached coarse IP location and refreshes it over HTTPS about
#          weekly. This sends your public IP to ipapi.co. If unavailable, the
#          fixed palette-sunrise/sunset hours are used.
#   off  — always use fixed hours; no location lookup.
# Optional manual coordinates override cache/network (decimal degrees).
# palette-latitude = -1.286389
# palette-longitude = 36.817223
# palette-longitude = 36.817223
# qypr-lock never performs a network lookup; it reads the shared cache only.
#   On light palettes the text shadow is disabled (opacity → 0) to avoid
#   ghost shades behind the dark glyphs; an explicit shadow-opacity key
#   (below) forces a shadow in every mode.
# colors-file = ~/.cache/matugen/standard-dark.css
# colors-file-light = ~/.cache/matugen/standard-light.css
# palette-mode = dark
# palette-location = auto
# palette-sunrise = 7
# palette-sunset = 19
#
# Style: "glass" (frosted translucent + sheen + hairline) or "solid" (opaque
# card with the same hue, no translucency). Restart the bar to apply.
# style = glass
#
# Icon style — how each applet draws its icon:
#   "auto"     — a symbolic icon from your active system icon theme
#                (gtk-icon-theme-name) when available, else the Nerd Font glyph.
#                Adopts your desktop icon theme on the fly. (default)
#   "symbolic" — always prefer the system icon theme (glyph fallback per-icon).
#   "glyph"    — always use the built-in Nerd Font glyphs.
# icon-style = auto
#
# The menu-bar backdrop tint/border default to `background`/`text` below, so the
# strip follows your palette; override with bar-tint / bar-border-color if wanted.
#
# Fonts
# font-family = Inter
# icon-family = CaskaydiaCove Nerd Font
# font-size = 16
# font-size-large = 24
# font-size-date = 28
# Lock-screen type scale:
# font-size-micro = 10
# font-size-small = 11
# font-size-meta = 12
# font-size-body = 13
# font-size-title = 14
# font-size-icon = 18
#
# Colours (hex: #RRGGBB or #AARRGGBB)
# background = #1e1e2e
# surface = #313244
# surface-hover = #45475a
# glass = #40313244
# glass-hover = #60454a5a
# glass-border = #30cdd6f4
# primary = #89b4fa
# primary-glow = #4089b4fa
# text = #cdd6f4
# text-subtle = #a6adc8
# text-muted = #6c7086
# error = #f38ba8
# success = #a6e3a1
# warning = #fab387
#
# Spacing (int px)
# spacing-small = 8
# spacing-medium = 16
# spacing-large = 24
# spacing-xlarge = 48
#
# Radius (int px)
# radius-small = 4
# radius-medium = 8
# radius-large = 16
#
# Animation durations (ms)
# anim-fast = 150
# anim-medium = 300
# anim-slow = 500
# anim-reveal = 600
#
# Effects
# shadow-opacity = 0.6
# shadow-offset = 2
#
# Statusbar
# bar-height = 36.0
# bar-icon-size = 16.0            # Nerd Font glyph size (icon-style = glyph)
# bar-symbolic-icon-size = 18.0   # themed *-symbolic icon size; raise to enlarge the
#                                 #   themed icons without growing the bar (try 20–24)
# bar-clock-icon-size = 16.0      # clock label size (independent of bar-icon-size)
# bar-icon-spacing = 18.0
# bar-padding = 14.0
# bar-corner-radius = 12.0
# popover-radius = 12.0
#
# Workspace indicators
# ws-width = 28
# ws-height = 6
# ws-gap = 6
# ws-active-height = 8
# ws-radius = 999
#
# Tray (SNI)
# sni-size = 22

# [tray]
# Tray applets a native module absorbs, matched on the applet's
# StatusNotifierItem Id (case-insensitive; * at the end = prefix, at the start
# = suffix, at both ends = substring). These extend the built-in claims; a
# claim only applies while that module is in the layout.
# claims-wifi = iwgtk
# claims-bluetooth = overskride
# claims-volume =
# claims-removable-devices =
# claims-phone-link =
# The app modules match the same patterns against an app's desktop id, name,
# notification app name and window app id; category:<Name> matches a
# desktop-entry category.
# claims-whatsapp = *zapzap*
# claims-email = *protonmail*, *tutanota*
#
# Tray apps nothing claims live behind the `background-apps` chevron. These
# put one next to it (pinned) or keep one out of sight (hidden), matched on
# the Id or the title, case-insensitively. An app asking for attention gets
# its own icon for as long as it asks.
# pinned = TelegramDesktop
# hidden = steam
