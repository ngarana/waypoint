# qypr theme: Gruvbox Dark
# Import this in bar.conf with: import themes/gruvbox.conf
[theme]
# Colours (Gruvbox Dark palette)
background   = #282828
surface      = #3c3836
surface-hover = #504945
glass        = #3c3836
glass-hover  = #504945
glass-border = #a89984
primary      = #d79921
primary-glow = #40d79921
text         = #ebdbb2
text-subtle  = #bdae93
text-muted   = #928374
error        = #fb4934
success      = #b8bb26
warning      = #fabd2f

style = solid